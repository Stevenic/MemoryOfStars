# =============================================================================
# THE BELL-FRAME — canonical 3-D positions for every system in the gazetteer.
# Source of truth for the accurate star chart (docs/_data/stars-named.yml plate
# positions will be DERIVED from these once the projection is wired — Auros's
# already-published plate pin at (760, 470) anchors the projection).
#
# Units: years of light. Origin: "the old zero" — inherited from the ancient mesh's
# routing tables (see atlas.md, "what the frame quietly holds"). Time is separate:
# the Toll, human zero (CR 0 = Toll 7,214).
#
# NO mesh / temporal-transmitter topology here — that layer is private (planning/)
# until the node pass. Positions are astronomy; the mesh is story.
#
# Every position honors the distance rules (cosmology.md — Established specifics):
#   - ships sublight always; colony crossings = years-to-decades (Reed->Sowen ~9 ly / ~20 yr)
#   - dark/dead relay segments carry signal at light speed (Enara->Skerry: 23 ly
#     line-of-sight, ~35 route-years by dogleg = the Signal's crawl, Books 02->03)
#   - route-distances on the page are never straight lines
# =============================================================================
frame:
  space:
    unit: ly
    origin: "the old zero (Hearth) — inherited, not chosen; see atlas guards"
    plane: "z ~ 0 is the local galactic plane"
  time:
    unit: toll
    zero: "the First Bell's first sounding (Gault)"
    cr0_toll: 7214
  galactic_context:
    core_distance_ly: 26000
    walked_pocket_ly: 130
    settled_reach_ly: 2000
    note: "the chart's milky band is the plane seen from inside it"
  kinematics:   # the spiral evolution (ratified 2026-08) — model: scripts/gen-galaxy.rb
    galaxy: "spiral, ours-like — two great arms + two minor, logarithmic, pitch ~12.5 deg"
    rotation: "flat curve ~230 km/s; galactic year at the pocket ~213 My; arms are a pattern (omega_p 0.0256 rad/My) stars flow through"
    shear: "bands 1,000 ly apart slip ~30 ly per My — arm-scale reshuffling is a 100-My-to-Gy affair"
    anchor: { r_ly: 26000, phi_rad: 0.35, z_ly: -40 }   # Hearth, on the spur's shoulder of the Road
    orientation: "bell x = direction of rotation (leading), y = outward from the core, z = galactic north"
    comoving: >
      the frame rides the pocket's stellar association — the family drifts together
      (internal dispersion ~4.5 km/s, ~15 ly/My), which is why seven millennia of
      route-tables stay valid; over the series' five centuries the map moves less
      than a hundredth of a light-year
    deep_time: >
      run the model backward ~1 My and the association's internal drift unwinds:
      the oldest works' spread tightens from ~10 ly rms to ~2 ly rms about the zero
      (author-side check in gen-galaxy.rb; see atlas guards before using this)

