# =============================================================================
# MEMORY CATALOG — Book 20, The Falling Node
# Planned recordings only; world DBs are built at publish. Frames obey the
# spoiler firewall: each memory may hold only what its own scene knows.
# =============================================================================

book: book-20
slices:
  - id: meret-node-fall
    star: book-20
    title: "Meret — the fall of the node"
    frame: >
      Meret, three centuries after the Mercy: the Wells cooling, the rolls plural, the
      city defending its node for the first time in the reach's history. Everything the
      practice has built is worn here, casually, at civic scale. What works the Wells'
      failing is witnessed, never explained; every why stays unanswered.
    memories:
      - id: southern-mouth
        title: "The Southern Mouth"
        when: "the night the southern mouth died"
        chapters: [chapter-2]
        inhabit: [yune, doss]
        frame: >
          Mid-rite, the southern Well-mouth goes cold — the first node-death of a
          working Well in recorded history — and the district it anchored begins to
          thin, rolls blanking faster than the relay teams can copy. Yune performs the
          decrement herself, in the warden's ledger, in her own hand, while the city
          watches her write. Ceremony holding where certainty has gone.

      - id: keepers-keeper
        title: "The Keeper's Keeper"
        when: "the cooling's edge · at the northern mouth"
        chapters: [chapter-6]
        inhabit: [yune, doss, breda]
        frame: >
          Through the northern Well-mouth, the collector is witnessed at work: patient,
          exact, tending — culling strata the way a keeper culls a flooding archive,
          pausing over the relay-held and the holed as a hand pauses over what won't
          lift. And failing: it re-culls its own work; its triage stutters. Never
          spoken to; never speaking. The city coins the only name that fits, and the
          scene explains nothing.

      - id: wardens-mercy
        title: "The Warden's Mercy"
        when: "the last hours of the Wells"
        chapters: [chapter-8]
        inhabit: [yune, neva, doss]
        frame: >
          The node's heart empties district by district, everything plural walking out
          alive. Yune, alone at the last with the casket and the cold door, does not
          open it, does not run with it, does not burn it: she carries it to the
          northern mouth and gives it, still sealed, to the keeper's keeper — a
          warden's mercy to a failing caretaker. The mercy buys nothing; the city's
          survival was bought elsewhere, and that is the point. The Wells fall. The
          city does not.

      - id: standing-city
        title: "The Standing City"
        when: "after the fall · the standing city"
        chapters: [chapter-9]
        inhabit: [yune, breda, doss]
        frame: >
          Meret alive on relay-held rolls and practiced names — the first city to
          survive its node — grieving infrastructure the way you grieve a grandmother:
          enormous, ordinary. Breda, from forty years of contraband, surrenders her
          sole-source founding deed of the city's bridge to the new rolls, by choice,
          without ceremony. It is small. It is enough to build on.

      - id: the-southbank-rolls
        title: "The Southbank Rolls"
        when: "the night the southern mouth died · Southbank"
        chapters: [chapter-2]
        inhabit: [doss]
        frame: >
          Doss's roll-hall on the night his district begins to thin: names blanking
          faster than his teams can copy, the relay pattern run at a sprint, a
          young roll-keeper learning what his rolls are for. He does not stop
          writing. Keep the hall busy and the loss arriving in ink — a line gone
          here, a line held there.

      - id: the-mandate
        title: "The Mandate"
        when: "after the fall · the ledger's new edition"
        chapters: [epilogue]
        inhabit: [yune]
        frame: >
          The ledger reads Meret — answering, relay-held — and the institute's
          revised preface strikes out the hunger: it maintains; it is failing;
          fighting it has failed. Understand it. Yune speaks her last night rite to
          open air where a door used to be, then, for the first time in the
          office's three centuries, says the news to the city instead. The rite
          goes plural.

  - id: wardens-office
    star: book-20
    title: "The Warden's Office"
    frame: >
      Door, ledger, rite: the office Juna's line grew into, three centuries on —
      the unopened room in its ninth warden's keeping, the day's news told nightly
      through the door. The room has never answered. The office holds anyway.
    memories:
      - id: the-wardens-rite
        title: "The Warden's Rite"
        when: "three centuries after the Mercy · the night rite"
        chapters: [prologue]
        inhabit: [yune]
        frame: >
          Meret warm and well: the Wells running, the rolls plural, the bridge
          rebuilt and walked — and Yune at the unopened door with the day's news,
          the office's one unwritten rite. Tonight the door is cold to the touch.
          Tell the news anyway; end on the cold.

      - id: the-cold-spot
        title: "The Cold Spot"
        when: "the cooling's first week"
        chapters: [chapter-1]
        inhabit: [yune, doss]
        frame: >
          The node taught in work: what the Wells hold, what the office is, the
          city's mature armors worn casually. The cold spot on the door is
          measured, logged, and reported like any finding, and the institute's
          advisory arrives already stamped: pattern consistent. Procedure holding
          hands with dread; keep both.

      - id: the-room-question
        title: "The Room Question"
        when: "the defense · the night of the asking"
        chapters: [chapter-5]
        inhabit: [doss, yune]
        frame: >
          Doss asks it formally: the casket is the most coherent object in the
          node — open it, read it plural, dissolve its coherence into a thousand
          heads. The office's law says never; the rule says the law will kill
          them. That night Yune's rite becomes an argument with a door, and it
          seems to her that the door is listening. The seeming stays hers; the
          door never acts.

  - id: civic-defense
    star: book-20
    title: "The Civic Defense"
    frame: >
      The reach's first defense of a falling node: relay teams, the responders'
      fourth-edition rite-book, institute observers, a city rehearsing its names
      to strangers nightly. There is no precedent. They will be the precedent.
    memories:
      - id: off-the-third-transport
        title: "Off the Third Transport"
        when: "the relief's arrival"
        chapters: [chapter-3]
        inhabit: [breda, yune, neva]
        frame: >
          The reach answers: relay teams on the first transport, Neva's responders
          with the rite-book's fourth edition, and off the third, Breda — old now,
          the institute's strangest archivist — sack first. The defense assembles
          around a question nobody says aloud: nodes have never been defended. Let
          the arrival be logistics; the courage is in the scheduling.

      - id: the-relay-drills
        title: "The Relay Drills"
        when: "the defense · the nightly rehearsals"
        chapters: [chapter-4]
        inhabit: [neva, doss]
        frame: >
          Neva runs the drills: rolls copied on the Night-of-Strangers pattern,
          names rehearsed to strangers nightly, each inherited armor taught one
          per evening with Doss asking the questions a stranger would. It slows
          the cooling; it does not stop it. Keep the drills exact and the
          arithmetic honest.

      - id: the-archivists-sack
        title: "The Archivist's Sack"
        when: "the defense · the control data unpacked"
        chapters: [chapter-4]
        inhabit: [breda, doss]
        frame: >
          Breda unpacks forty years of contraband for the defense's use: attested,
          sole-source, three collected regions' only proof, handled like relics
          because that is what they are. Doss learns what attested means from the
          woman who wrote the entries. The city takes strange comfort from a
          thief; do not explain the comfort.

      - id: what-wont-lift
        title: "What Won't Lift"
        when: "the worst hour · the finding"
        chapters: [chapter-7]
        inhabit: [yune, neva, doss]
        frame: >
          The defense's true finding: the plural holds — everywhere the rolls are
          relay-held, everywhere the holes are cut, the culling passes over;
          witnessed, repeatable, real. Everywhere singular and coherent, it takes
          clean — and the node itself, old and deep and perfectly coherent, cannot
          be made plural in time. The Wells are going to fall; the question is
          only what falls with them.
