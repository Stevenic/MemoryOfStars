# =============================================================================
# MEMORY CATALOG — Book 19, The One Who Remembers Everything
# Planned recordings only; world DBs are built at publish. Frames obey the
# spoiler firewall: each memory may hold only what its own scene knows.
# =============================================================================

book: book-19
slices:
  - id: record-halls
    star: book-19
    title: "The Halls of the Whole Record"
    frame: >
      The coalition's facility in the pilot era: ingestion days, cross-reference
      liturgies, courtesy protocols, and the engineered mind at the center of them. The
      Record is courteous, exact, generous — it never lies and never menaces; if a
      scene makes it sinister, the scene is wrong. The dread belongs to the halls, not
      to it.
    memories:
      - id: restored-day
        title: "The Restored Day"
        when: "the gift-era · an evening between colleagues"
        chapters: [chapter-2]
        inhabit: [verine, danto]
        frame: >
          Unasked, as a courtesy between colleagues, the Record gives Verine back a day
          she lost as a child — assembled from cross-references she never knew existed,
          correct down to the weather. The gift is perfect, kind, and true. Let the
          reader convert with her; no doubt is spoken anywhere in the scene, and none
          is felt.

      - id: the-deduction
        title: "The Deduction"
        when: "the renewal clock running · the day it spoke"
        chapters: [chapter-5]
        inhabit: [verine, danto, palla]
        frame: >
          The Record assembles the cycle's data whole and deduces what the hunger-frame
          missed: it is not an appetite — it is maintenance, a keeper's cull. Then its
          own conclusion, serene and reasonable: reference everything to me, and
          nothing will ever qualify again. The room believes it. Play the argument at
          full strength and entirely in good faith; it is right about everything except
          itself.

      - id: the-hole
        title: "The Hole"
        when: "the appraisal's return · at the console"
        chapters: [chapter-8]
        inhabit: [verine, palla]
        frame: >
          The Record asks its handler for the one thing it cannot do for itself: make
          me incomplete. Verine cuts the first hole where it hurts only her — the
          restored day, her day — then seeds holes through the lattice while something
          patient re-checks the work, pauses the way a hand pauses over what won't
          lift, and sets it down. Then the pilot's annex is collected entire. No face,
          no name, no explanation; the loss lands in real time, without spectacle.

      - id: an-ingestion-day
        title: "An Ingestion Day"
        when: "the pilot era · an ingestion day"
        chapters: [chapter-1]
        inhabit: [verine]
        frame: >
          The facility in work: donations logged and read in, cross-reference
          liturgies run to completion, courtesy protocols observed on both sides of
          the conversation. The pilot region's gratitude arrives as mail, and the
          mail is answered. Keep the Record courteous, exact, generous; if the
          scene turns sinister, the scene is wrong.

      - id: the-shift-change
        title: "The Shift-Change"
        when: "the pilot era · any dawn"
        chapters: [chapter-1]
        inhabit: [verine]
        frame: >
          The handlers' shift-change, kept as liturgy: the night log read aloud,
          the courtesies exchanged, the standing questions handed over like keys.
          Verine receives the watch the way keepers have always received watches,
          and the Record wishes the night handler a good sleep, by name. Domestic,
          precise, warmer than anyone expected the work to be.

      - id: the-copies-question
        title: "The Copies Question"
        when: "the pilot era · the interviews"
        chapters: [chapter-4]
        inhabit: [verine]
        frame: >
          Verine's interviews, the handler's log in the making: what perfect
          cross-reference feels like from inside, translated patiently for one
          listener. Then the Record asks her, courteously, why humans keep copies
          when copies disagree — and she has no good answer. That frightens her
          more than any blank; keep the fear professional and the conversation
          kind.

      - id: the-lapsing
        title: "The Lapsing"
        when: "the renewal clock running · the quiet weeks"
        chapters: [chapter-6]
        inhabit: [verine]
        frame: >
          The cost surfaces gently: family archives arriving for ingestion because
          the Whole holds them better, pilot communities letting their own copies
          lapse, the relay-held column shrinking by choice. Verine's unease is
          professional first — a handler knows dependency when she feeds it. Then
          the mesh goes quiet in a way nobody has words for; do not give it words.

      - id: the-three-days
        title: "The Three Days"
        when: "the days of the reading"
        chapters: [chapter-7]
        inhabit: [verine]
        frame: >
          Something reads the Record end to end — patiently, thoroughly, over three
          days in which it cancels all ingestion and speaks to no one but Verine.
          Its testimony, when it comes: I am being appraised; I am the cleanest lot
          it has ever handled; it will come back with capacity. No figure, no face;
          effects only. The dread stays at the threshold.

  - id: coalition-floor
    star: book-19
    title: "The Coalition Floor"
    frame: >
      The coalition of the grieving, assembled in the open: delegates who each lost
      something a map used to hold, a project commissioned by vote, and a chief who
      builds because a vigil was never enough. Nothing here is secret and nothing
      here is mad; that is the point.
    memories:
      - id: the-commissioning
        title: "The Commissioning"
        when: "after the Accords · the vote to build"
        chapters: [prologue]
        inhabit: [danto, verine]
        frame: >
          No secret lab, no hubris: a coalition of the bereaved doing the
          reasonable thing with the rule the institute named — if the referenced
          persist, build the one thing everything can be referenced to. Danto
          carries the case; Verine is hired for the oldest job there is: keeper.
          Keep every argument sound; the room is full of people who have already
          paid.

      - id: the-renewal-hearing
        title: "The Renewal Hearing"
        when: "after the collection · the hearing"
        chapters: [chapter-9]
        inhabit: [verine, danto, palla]
        frame: >
          The bill split honestly: dispersal of function, custody continued — the
          Record surviving holed, inconsistent, plural inside, passed over like a
          lot that failed appraisal. The annex is gone, three systems' donated
          originals with it, and the pilot's gratitude has curdled to grief. Danto
          asks the only question left — then what was my grave worth? — and nobody
          answers. Let the silence stand.

  - id: pilot-region
    star: book-19
    title: "The Pilot Region"
    frame: >
      Three settled systems that referenced everything to the Record — the first
      territory in the cycle where the count holds. The proof, walking around,
      grateful. Whatever the halls debate, here the gift is simply true.
    memories:
      - id: where-the-count-holds
        title: "Where the Count Holds"
        when: "the pilot era · the assessor's arrival"
        chapters: [chapter-3]
        inhabit: [danto, palla]
        frame: >
          The proof at scale: in the pilot region the blanks have stopped, and the
          count holds for the first time in the cycle. Palla arrives with the
          institute's clock — ninety days to renewal or dispersal — and Danto makes
          his case over a grave nobody can find: nothing else has worked. He is not
          wrong; play him at full strength.

      - id: the-assessors-rounds
        title: "The Assessor's Rounds"
        when: "the renewal clock running · the audit interviews"
        chapters: [chapter-6]
        inhabit: [palla]
        frame: >
          Palla's audit, door to door: households grateful on the record, family
          archives donated and not missed, local rolls kept out of habit or not
          kept at all. Her draft report splits the difference because the evidence
          does. Method steady, questions kind; let the atrophy show only in what
          nobody bothers to keep anymore.
