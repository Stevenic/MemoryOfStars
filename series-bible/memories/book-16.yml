# =============================================================================
# MEMORY CATALOG — Book 16, The Unwritten
# Planned recordings only; world DBs are built at publish. Frames obey the
# spoiler firewall: each memory may hold only what its own scene knows.
# =============================================================================

book: book-16
slices:
  - id: order-houses
    star: book-16
    title: "The Houses of the Unwritten"
    frame: >
      The order's houses in the years of the census: rites of unmaking done with love,
      the ceded lands beyond the windows going quiet. Unwriting is mercy here — keep the
      reader half-believing. Nothing in this recording knows what the blanks are.
    memories:
      - id: great-unwriting
        title: "The Great Unwriting"
        when: "the year of the census · the Great Unwriting"
        chapters: [chapter-2]
        inhabit: [breda, maunt, odd]
        frame: >
          A terrified town has donated its whole archive, and the order unmakes it in
          public liturgy — the largest rite in a century, a thousand years of paper
          becoming light and lightness. Render it as terrible beauty, not destruction;
          the keepers grieve nothing because they believe nothing is lost. In the rite's
          shadow, Breda's hands do what they always do: one page, palmed — she does not
          look at what it is.

      - id: ascension
        title: "The Blank Sanctuary"
        when: "the pilgrimage · the day of ascension"
        chapters: [chapter-4, chapter-5]
        inhabit: [breda, maunt, lang]
        frame: >
          The order's oldest unwritten sanctuary — three centuries unrecorded, the
          proof-of-concept — is gone-gone: not hidden, a blank the land itself has half
          forgotten. The order reads ascension and celebrates with full liturgical joy.
          Breda stands inside the celebration holding the only page that proves the
          sanctuary was ever real, and understands, alone: the obscure vanish first.
          Keep the joy sincere; keep her silence complete.

      - id: unwriting-of-breda
        title: "The Unwriting of Breda"
        when: "her last night in the order"
        chapters: [chapter-8]
        inhabit: [breda, maunt, odd]
        frame: >
          The excommunication: her name unmade from every roll, rite, and mouth — the
          congregation forgetting her aloud, tenderly, one witness at a time, while she
          stands present. Maunt does not want her punished; he wants her saved, and his
          kindness is the scene's horror. No one in the room knows about the floorboard.
          Cruelty rendered entirely as mercy; grief with nowhere to land.

      - id: the-letters
        title: "The Letters"
        when: "an ordinary season · a small rite"
        chapters: [prologue]
        inhabit: [breda, maunt]
        frame: >
          A dying woman gives the order her letters, and the rite unmakes them while
          she watches: paper becoming light, and the woman going light with it. The
          keepers are undertakers for the written, and their tenderness is real.
          Mercy first — nothing in this scene argues, and no one in it doubts.

      - id: novice-rounds
        title: "Novice Rounds"
        when: "the year of the census · before the dawn office"
        chapters: [chapter-1]
        inhabit: [odd, breda]
        frame: >
          Sister Odd's rounds before the dawn office: the rite-tools laid out, the
          bare shelves swept, the liturgy of unmaking recited until it sits level in
          the mouth. She is the house's sharpest pair of eyes, and everything she
          notices she keeps in order, the way she was taught. Keep her faith whole
          and her attention innocent.

      - id: the-census-table
        title: "The Census at the Table"
        when: "the year of the census · the survey read aloud"
        chapters: [chapter-3]
        inhabit: [maunt, lang, breda]
        frame: >
          Lang's survey reaches the order's table: the ceded territories are going
          blank faster than the kept world. Maunt's serenity absorbs the number
          whole — of course the unwritten go first; they are ready — and the meeting
          ends in perfect peace. That night, alone, Breda checks the count against
          her floorboard. The courtesy never breaks; the crack is private.

      - id: the-keepers-arithmetic
        title: "The Keeper's Arithmetic"
        when: "after the pilgrimage · a candle kept late"
        chapters: [chapter-6]
        inhabit: [breda, odd]
        frame: >
          Breda runs the ledger the order refuses to keep: every unmade thing she
          has stolen from, mapped against Lang's blanks. The correlation is damning
          but for one entry — an unmade thing that persists, the one item three
          towns' registries copied first — and she does not know what the exception
          means. Sister Odd catches her at it, and the scene holds its breath over
          which loyalty the novice keeps.

      - id: the-question-of-odd
        title: "The Question of Odd"
        when: "the last days · the keeper's cell"
        chapters: [chapter-7]
        inhabit: [odd, maunt, breda]
        frame: >
          Odd reports the heavier sleeves — not from malice, from faith: a keeper
          who keeps is unmaking the order's salvation. Maunt comes to Breda's cell
          with love and a rite; he does not want her punished, he wants her saved.
          Give the novice's choice its full weight. No one in this scene is lying,
          and that is the horror.

  - id: border-post
    star: book-16
    title: "The Border Post"
    frame: >
      The institute's crossing at the edge of the ceded territories: a table, a ledger,
      a patient man who asks only to count. Counting is the one heresy the order cannot
      name. Plain, unhurried, exact.
    memories:
      - id: the-border
        title: "The Intake Question"
        when: "the morning after · the crossing"
        chapters: [chapter-9]
        inhabit: [breda, lang]
        frame: >
          A woman with no name in any record arrives at the crossing carrying three
          regions' only proof in a sack. Lang's intake is procedure, gentle by being
          ordinary: the ledger open, the pen ready, the question — Name? For the first
          time she writes rather than keeps: she writes it herself. Play it small; it is
          the largest thing in the book.

      - id: accession
        title: "Accession"
        when: "after the crossing · the ledger's new entries"
        chapters: [epilogue]
        inhabit: [lang, breda]
        frame: >
          The institute's ledger takes three regions into the count in a careful
          hand: attested, single source — and beside each, the librarian's note,
          sole surviving reference. Far away, under a floorboard in a cell she will
          never see again, one thread from every binding she could not save. Small
          entries; let them weigh.

  - id: keeper-town
    star: book-16
    title: "The Keeper-Town"
    frame: >
      The town that kept a thousand years of paper, in the days before it gave the
      archive up: long shelves, diaspora bequests, and a fear of the blanks that has
      outgrown every argument. The order's keepers arrive the way undertakers
      arrive — early, quiet, kind.
    memories:
      - id: the-last-night-of-the-archive
        title: "The Last Night of the Archive"
        when: "the eve of the Great Unwriting"
        chapters: [chapter-2]
        inhabit: [breda, odd]
        frame: >
          The town sits up with its archive the way a family sits up with a body:
          lamps low, families walking the long shelves, a bequest held one last
          time. The order's keepers keep the watch with them, certain that nothing
          will be lost. Grief and relief share the room; do not resolve which is
          which.

  - id: survey-camps
    star: book-16
    title: "The Border Survey"
    frame: >
      Lang's camps along the ceded line: a tent, a ledger, a route walked in all
      weathers. The institute asks nothing of the order but numbers — and numbers
      are the one heresy it cannot name. Plain, patient, unwelcome.
    memories:
      - id: the-counting-camp
        title: "The Counting Camp"
        when: "the year of the census · a night on the ceded line"
        chapters: [chapter-1]
        inhabit: [lang]
        frame: >
          Lang's camp at the border of the ceded lands: the day's route walked, the
          evening's tally inked, the same columns in the same order every night. He
          is tolerated, never welcomed, and he minds neither. A patient man doing
          the one thing the order cannot forgive: counting.

      - id: the-empty-milestones
        title: "The Empty Milestones"
        when: "the census · deep in the ceded lands"
        chapters: [chapter-3]
        inhabit: [lang]
        frame: >
          A survey day in territory the order ceded to silence: good roads, standing
          wells, and hamlet after hamlet that answers nothing. Lang logs each in the
          institute's terms and does not editorialize. The dread is in the columns;
          keep his voice level.
