# Memories catalog — Book 30: The Memory of Stars (format: see README.md)
# Slice firewall: each frame holds only what its scene knows at that moment.
# House guards: the keeper is role-named only and never inhabitable; the deepest
# room keeps its question kept; nothing here says what the collected become.

book: book-30
slices:
  - id: keepers-house
    star: book-30
    title: "The Keeper's House"
    frame: >
      Past the threshold: a keeper's rooms, small and worn and kept — a million
      years of duty rendered as furniture. The committee is received
      courteously, with the sense of being expected; not by prophecy, by hope.
      The keeper is never seen and never named. What the kept become is not in
      this recording, and never will be.
    memories:
      - id: is-it-finished
        title: "Is It Finished?"
        when: "the first days in the house"
        chapters: [chapter-2]
        inhabit: [alba, ketra, zel]
        frame: >
          The house asks the living, at last, whether the work of keeping is
          finished — and Alba, whose whole craft is tending the unfinished,
          gives the honest answer: no; it was never going to be; that was never
          the assignment. Somewhere in the rooms, something very old sets
          something down halfway. The relief becomes possible in that sound.
          Keep it quiet; no one raises a voice in this house.

      - id: what-they-do-not-ask
        title: "What They Do Not Ask"
        when: "deep in the relief · the deepest room"
        chapters: [chapter-5]
        inhabit: [alba, ketra, zel]
        frame: >
          In the deepest room the oldest question is answerable at last —
          present, offerable, the keeper willing — and Ketra reaches the
          threshold of asking with a lifetime's craft behind her; stopping costs
          her everything her order taught her. They do not ask: the door
          answered plurality, the watch must stay refusable, and a committee
          that took the whole answer would carry the old error into the final
          hour. Some things go home with the keeper. Alba closes that door
          gently, from outside.

      - id: the-farewell
        title: "The Farewell"
        when: "the day the watch passes"
        chapters: [chapter-7]
        inhabit: [alba, zel, gale, idra]
        frame: >
          The roll signed by the traditions' five, and then the words — said by
          everyone at once, to the keeper, plainly, as mechanism: "Come home
          carrying more people than yourself." The watch passes; the duty
          distributes; the one who stayed is carried at last, held by the living
          the whole way down. The weeping belongs to the living. Render the
          relief with restraint — a duty completed, and a burden taken up by
          many hands.

      - id: past-the-threshold
        title: "Past the Threshold"
        when: "arrival · the first rooms"
        chapters: [prologue]
        inhabit: [alba, ketra, zel, idra]
        frame: >
          The first rooms: small, worn, kept — a million years of duty
          rendered as furniture, a sealed casket dusted, a returned crate set
          on its shelf at last. The committee is received the way a keeper
          receives: courteously, with the sense of being expected — not by
          prophecy, by hope. No horror. A house.

      - id: the-rooms-walked
        title: "The Rooms Walked"
        when: "the first days · the house walked"
        chapters: [chapter-1]
        inhabit: [alba, idra, ketra]
        frame: >
          The house walked room by room: not a hoard — rooms tended past
          remembering why, with a keeper's exactness. The crafts read as they
          go — Idra mapping, Ketra listening, Alba's hands knowing the
          incomplete when they touch it. Ask nothing of the rooms; let them be
          kept.

      - id: the-terms-of-the-watch
        title: "The Terms of the Watch"
        when: "the succession · designed with the house"
        chapters: [chapter-3]
        inhabit: [gale, ketra, bode]
        frame: >
          The succession designed with the house, not seized from it: the
          watch's duties enumerated the way the rooms understand them, matched
          craft by craft, the roll read aloud tally by disagreeing tally. Bode
          is admitted the only way the door admits anyone — as part of someone
          else's plural — and offered a seat, not a throne. Keep the
          negotiation courteous on every side of it.

      - id: the-braiding
        title: "The Braiding"
        when: "the relief · the work"
        chapters: [chapter-4]
        inhabit: [gale, zel, idra]
        frame: >
          The mechanism assembled, and it is work, not ceremony: routes,
          hearings, the map, the carrying, the tending — five crafts braided
          into one succession. A strand slips; an hour runs unheld; something
          small is lost, and the cost is logged, and the braid is taken up
          again by hands not yet sure. Learning by failing once is the scene.

      - id: the-guest-rooms
        title: "The Guest Rooms"
        when: "between shifts · the quieter rooms"
        chapters: [chapter-4]
        inhabit: [alba, zel]
        frame: >
          Between shifts of the braiding, the house's quieter rooms: beds kept
          made for guests who never came, a table laid and dusted and laid
          again, water that is always somehow warm. The committee sleeps in
          hope given furniture. Keep it hushed; gratitude here is letting the
          rooms do their work at last.

      - id: the-season-strains
        title: "The Season Strains"
        when: "the long middle · the reach under load"
        chapters: [chapter-6]
        inhabit: [alba, gale, idra]
        frame: >
          The widest view, under strain: one world's wearing falters —
          volunteered attention is unenforceable, and a season is long — and
          the committee inside the house can do nothing but braid faster. Then
          the crest, costlier and truer for the crack in it: forty worlds
          holding each other on purpose, imperfectly. The house's weather goes
          still; it is looking.

      - id: the-first-hours
        title: "The First Hours"
        when: "the standing watch · the fever hour"
        chapters: [chapter-8]
        inhabit: [ketra, zel, gale]
        frame: >
          The distributed watch's first hours — and one final erratic spike,
          mid-transfer, takes a real thing nobody budgeted: the completed
          deposition, coherent and singular, collected in the handover's one
          unguarded hour. It survives from that moment only in what Ketra can
          say aloud. Then the fever breaks: the triage running plural —
          consent-shaped, many-handed, refusable. Price the loss plainly and
          let the relief arrive quiet.

      - id: the-unwinding
        title: "The Unwinding"
        when: "the after · the committee disbands"
        chapters: [chapter-9]
        inhabit: [alba, bode, gale]
        frame: >
          The unwinding done right: no order founded, no charter — the
          committee disbands into its traditions, the house a visited place
          now. Bode declines the seat, courteously to the end, and files his
          dissent beside the roll — both kept, neither ruled on. Alba signs
          the blank section at last, not with an answer but an attestation;
          her first unfinished thing, signed gladly.

  - id: the-kitchen
    star: book-30
    title: "The Kitchen"
    frame: >
      The last place the story shows: a kitchen in Orin, after everything —
      bread, thyme, the two bowls, the amended festival outside, the silent
      mountain wearing stars. The story itself is told here now, the way this
      civilization keeps everything.
    memories:
      - id: the-story-told
        title: "The Story, Told"
        when: "after everything · evening in Orin"
        chapters: [epilogue]
        inhabit: [alba, zel]
        frame: >
          A child asks for the story and gets it the way everything is kept now
          — told plural, held light, one voice among many, drifting a little in
          the telling, which is how it survives. Guests who were there let the
          town's version stand. On the sill, wet with black grass, the red bird;
          on the child's answer, the two-finger gesture at the sky. Small, and
          home; end there.

      - id: before-the-asking
        title: "Before the Asking"
        when: "after everything · the kitchen at dusk"
        chapters: [epilogue]
        inhabit: [alba, zel]
        frame: >
          The kitchen before the story is asked for: bread cooling, thyme in
          the window, the two bowls laid, the amended festival warming up
          outside and the silent mountain wearing stars. Guests who were there
          help with supper and claim nothing. Let the ordinary evening carry
          all the weight it has earned, and wait for the child to ask.
