# Memories catalog — Book 12, The Ninth Observer (~CR 362)
# Catalog only; world DB is built at publish. Slice firewall applies at frame level.

book: book-12
slices:
  - id: lowens-rest
    star: book-12
    title: "Lowen's Rest — the Leaving year"
    frame: >
      The last town on Aulis, in the generation of the Leaving: the sun failing, the
      ships booked years out, a town packing crate by crate under a mountain with a
      letter slot nobody remembers cutting. Above the town, the Harrow terraces; in
      the town, a schoolteacher who has written to the mountain all his life. The
      nine earlier seasons, and why the mountain answers now, are not in this
      recording.
    memories:
      - id: letters-to-the-mountain
        title: "Letters to the Mountain"
        when: "the Leaving year · morning post"
        chapters: [chapter-1]
        inhabit: [imre, veck]
        frame: >
          Imre posts a letter into the mountain slot his grandmother showed him, as
          he has since he was a boy; the mountain has never answered anyone. Sister
          Veck arrives carrying a referral in her satchel — the one who watches the
          rains — and explains, politely, that the order has come to depose the
          planet. Imre laughs. Then doesn't.

      - id: the-valley-answers
        title: "The Valley Answers"
        when: "overnight · first light on the Harrow"
        chapters: [chapter-2]
        inhabit: [imre, lyddi, veck]
        frame: >
          Overnight the Harrow valley has re-greened, out of season and against the
          dusk, in the shape of the town's word for stay — the letterforms traced
          stroke for stroke from the schoolhouse lintel. Lyddi is the one who sees it
          true: it's a picture, not a word. After nine civilizations of silence the
          mountain has replied, and the awe curdles fast into why now, and why never
          before. No one has an answer; do not supply one.

      - id: the-grandmothers-trick
        title: "The Grandmother's Trick"
        when: "the last festival · dusk on the terraces"
        chapters: [chapter-8]
        inhabit: [imre, lyddi, veck]
        frame: >
          The town's last festival, restaged as the old greeting-rite on the Harrow
          terraces where the Observer can watch: every person speaking their name to
          two others, the farewell worn as a dance. It cannot keep the names. It can
          keep, forever, the shape of a people who named each other. Warm, crowded,
          and grieving underneath; the goodbye is the point.

      - id: the-last-letter
        title: "The Last Letter"
        when: "sailing day · the last post"
        chapters: [chapter-9]
        inhabit: [imre, lyddi]
        frame: >
          The ships go. Imre posts one more letter into the slot — not a petition; a
          thank-you — and boards with Lyddi. They are not the keepers here; they are
          the kept, held forever, imperfectly, namelessly, by something that will
          outlast every ship. Keep it plain, and let the gratitude carry it.

      - id: the-lintel-lessons
        title: "Two Geographies"
        when: "the Leaving year · a school morning"
        chapters: [chapter-1]
        inhabit: [imre]
        frame: >
          The schoolhouse in the Leaving year: two geographies on one slate board —
          home, and wherever next — and over the door the old carved lintel, its
          letters cut by a hand nobody remembers and touched smooth by generations
          of children going in. Imre teaches the morning as if the year were
          ordinary. Keep it small and steady; the goodbye stays under the
          arithmetic.

      - id: the-berth-lottery
        title: "The Berth Lottery"
        when: "the Leaving year · lottery day"
        chapters: [chapter-1]
        inhabit: [imre]
        frame: >
          Lottery day in the meeting hall: berths drawn by household, ships booked
          years out, a family split across two sailings taking the news standing
          up. No rescue fleet, no miracle, no speeches — the Leaving is priced, and
          the town pays in order. Imre keeps the list because someone must; let the
          fairness be the hard part.

      - id: ship-mad-afternoons
        title: "Ship-Mad Afternoons"
        when: "the Leaving year · after school"
        chapters: [chapter-2]
        inhabit: [lyddi, imre]
        frame: >
          Lyddi's afternoons: sail-tables copied into a notebook, burn windows
          recited like verses, the berth papers checked weekly against a departure
          that cannot come soon enough. She is first to leave and least
          sentimental, and she loves her grandfather anyway, in the practical
          tense. Bright and quick; her wanting to go is not a wound — do not play
          it as one.

      - id: the-deposition
        title: "The Deposition"
        when: "the deposition's first weeks · the plantings"
        chapters: [chapter-3]
        inhabit: [imre, veck]
        frame: >
          Veck's interview begins: questions posed in plantings, answers arriving
          as weather, a sentence a week. The nine rises start to surface — nine
          civilizations remembered as seasons, their terraces and their winter
          lights, never one name — and Imre files his own petition beside hers:
          remember us as we called ourselves. Patient, procedural, and enormous
          underneath.

      - id: nine-rises
        title: "Nine Rises"
        when: "the deposition deepens · the transcription"
        chapters: [chapter-4]
        inhabit: [imre, veck]
        frame: >
          The testimony deepens: what a season-memory keeps is everything but the
          words — nine whole peoples held perfectly, anonymously. The beauty and
          the horror are the same fact, and no one in the room is allowed to choose
          between them. Keep the Observer's answers in weather and stone; never let
          it speak like a person.

      - id: the-oldest-stratum
        title: "The Oldest Stratum"
        when: "the deposition · beneath the nine"
        chapters: [chapter-5]
        inhabit: [veck, imre]
        frame: >
          Beneath the nine, the instruments find a passage that was not a rise —
          older than all of them, rendered in strata and subsidence, a going-down
          instead of a season. Veck seals the page with shaking hands and files her
          unease in the order's plain words: the old minds are stirring. State what
          the stratum holds in the Observer's idiom only, and answer nothing.

      - id: the-tenth-season
        title: "The Tenth Season"
        when: "midsummer of the Leaving year · the answer"
        chapters: [chapter-6]
        inhabit: [imre, veck]
        frame: >
          The Observer answers the petition with an offer and a correction: it has
          never kept a name in nine tries, and what it can give is larger and worse
          — the town held as its tenth season, perfectly, forever, namelessly. The
          awe and the insult arrive together, and the town must now choose between
          anonymity forever and nothing at all. Let the offer be genuinely kind;
          its limits and its kindness are the same fact.

      - id: what-a-season-keeps
        title: "What a Season Keeps"
        when: "the weeks of dividing · kitchen by kitchen"
        chapters: [chapter-7]
        inhabit: [imre, veck]
        frame: >
          The town divides over the offer — anonymity forever against nothing at
          all — and Imre argues both sides nightly, in letters to the mountain.
          Veck's counsel comes from her order's charter: do not tidy; a plural
          record beats a perfect one. Domestic, divided, and courteous; nobody is
          wrong.

  - id: harrow-after-the-ships
    star: book-12
    title: "The Harrow — after the ships"
    frame: >
      The Harrow terraces seasons after the ships went: an emptied world, a
      mountain still keeping, and a Listener returned with instruments to read
      what it wrote. The town's voices are not in this recording; that is the
      point of it.
    memories:
      - id: the-tenth-rise
        title: "The Tenth Rise"
        when: "seasons after the ships · the Harrow, by instrument"
        chapters: [epilogue]
        inhabit: [veck]
        frame: >
          Veck's addendum: the newest stratum read by instrument — a season shaped
          like people naming one another — and beneath it, freshly cut, the
          Observer's first addition to its own record in nine rises: a referral,
          given within its limits, about the ones who left by water that sails. It
          knows only what departed from it; the sky is not its province. Close the
          file gently; the mountain is still writing.
