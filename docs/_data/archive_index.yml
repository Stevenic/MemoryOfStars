# =============================================================================
# THE ARCHIVE INDEX — the star map that fronts the Step Inside / Archive feature.
# Thirty novellas as six constellations of five stars. Drives docs/step-inside.md.
#
# SPOILER FIREWALL: public information only. Cycle 1's titles/facets are public
# (they appear in the repo + site). Cycles 2–6 are DARK, UNNAMED stars on purpose
# — nothing from planning/ may ever appear here. A dark star has no title.
#
# status: published (book done) · writing (in progress) · planned (named, unwritten)
#         · dark (unnamed future). "Has recordings" is derived at runtime from
#         docs/_data/archive/*.yml (slice.star → book id) — not stored here.
# =============================================================================

