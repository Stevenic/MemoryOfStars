<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span class="brand-name">The Memory of Stars</span>
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" hidden>
    <label for="nav-toggle" class="nav-toggle-label" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </label>
    <nav class="site-nav" aria-label="Primary">
      {%- assign current = page.url -%}
      {%- for item in site.data.nav -%}
        {%- assign item_url = item.url | relative_url -%}
        <a href="{{ item_url }}"{% if page.url == item.url or current contains item.url and item.url != '/' %} class="active" aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor -%}
    </nav>
  </div>
</header>
