# Reading versions for this book.
#
# When this file is present, the site renders one set of reading pages PER version
# and shows a version picker in the reader. When it is ABSENT, the book renders as a
# single version from manuscript.md with no picker (the original behaviour).
#
# - `default` is the version served at the plain /read/book-NN-<chapter>/ URLs, so
#   existing links keep working. Non-default versions get /read/book-NN-<id>-<chapter>/.
# - `file` is relative to this book folder. The default version normally points at the
#   live manuscript.md; frozen snapshots live under versions/.
# - `label` is what the picker shows. Keep it short (fits a segmented control).

default: revised

versions:
  - id: original
    label: Original
    file: versions/original.md
    note: The first complete draft.
  - id: pre-edit
    label: Pre-edit
    file: versions/pre-edit.md
    note: Snapshot before the line pass (Act I, 2026-08) — for comparison.
  - id: v1
    label: v1 (79.1)
    file: versions/v1-published.md
    note: >-
      The shipping text at the start of the 91+ lift campaign. Baseline 79.1/100
      (three independent judges: 77.8 / 78.8 / 80.6).
  - id: revised
    label: Revised
    file: manuscript.md
    note: >-
      Dialogue, emotion and rhythm pass; choreography pass (beta-reader feedback);
      line pass over Act I (filler, adjectives, adverbs, sentence music).
