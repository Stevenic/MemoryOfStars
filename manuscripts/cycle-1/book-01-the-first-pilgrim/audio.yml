# Audio production sheet — The First Pilgrim (Book 01)
# Feeds a future ElevenLabs pipeline; NOT published to the website.
# The web reader also reads `mood`/`pace` per chapter as optional prosody hints.
# All values are starting suggestions — edit to taste; you know the voices in your head.

voice:
  narrator_ref: "TBD"                 # ElevenLabs voice id or name once chosen
  description: "aged, warm, measured — a man who has climbed this mountain fifty-three times"
  default_style: "intimate, reflective"
  default_pace: "slow"
  # ElevenLabs voice-settings placeholders (0.0–1.0):
  stability: 0.55
  similarity_boost: 0.75
  style: 0.30

# Canonical pronunciations for coined/ambiguous names.
# respell = plain phonetic respelling; ipa = IPA. CONFIRM these against your intent.
pronunciation:
  Elias:      { respell: "eh-LEE-as",   ipa: "ɛˈliːɐs",   note: "not EE-lee-as" }
  Lyra:       { respell: "LY-ruh",      ipa: "ˈlaɪrə" }
  Orin:       { respell: "OR-in",       ipa: "ˈɔːrɪn" }
  Tomas:      { respell: "TOH-mahs",    ipa: "ˈtoʊmɑːs" }
  Mara:       { respell: "MAH-rah",     ipa: "ˈmɑːrə" }
  Amarin:     { respell: "AH-muh-reen", ipa: "ˌɑːməˈriːn" }
  Pilgrimage: { respell: "PIL-gruh-mij", ipa: "ˈpɪlɡrɪmɪdʒ", note: "capitalized in-world; read with weight" }
  Gate:       { respell: "gayt",        note: "proper noun — the Gate; slight emphasis" }

# Per-chapter direction. `id` matches the manuscript heading:
#   prologue | chapter-1 … chapter-9 | epilogue
chapters:
  - id: prologue
    title: "The Mountain Remembers"
    mood: "elegiac, hushed, reverent"
    pace: "very slow"
    pause_ms: { scene_break: 1500, line: 500 }   # ⸻ = long pause; each short line breathes
    notes: >
      Solitary and quiet. Let the one-line paragraphs breathe. The two ⸻ scene breaks
      are long silences. The final two lines are the gut-punch — hold silence before
      "He could not remember whether he had climbed it alone."

  - id: chapter-1
    title: "The Last Ordinary Morning"
    mood: "warm, domestic, quietly foreboding"
    pace: "measured"
    pause_ms: { scene_break: 1200, line: 350 }
    notes: >
      Two distinct registers: the kitchen banter with Mara and Tomas is light and quick —
      let the dialogue overlap and land its comedy — under a current of dread the adults
      can't hide. Tighten the pace for banter, slow for Mara's fear and the Elias beat.
      The bells motif matters: hit "a seventh" (miscounted) and the closing "A fourth note
      where none belonged" with a faint unease. The final three "Seven days…" lines are a
      slow, deliberate close.
    voices:
      Lyra: "seventeen; curious, dry wit"
      Mara: "mother; warm, guarded, grieving something unspoken"
      Tomas: "same age as Lyra; fast, deadpan, theorizing"
      Elias: "very old; gentle, then shaken by recognition"

  - id: chapter-2
    title: "Tomas Knows Everything"
    mood: "wry, companionable, mystery gathering underneath"
    pace: "measured; quick in the Lyra/Tomas volleys"
    pause_ms: { scene_break: 1200, line: 350 }
    notes: >
      Five ⸻ scene breaks — treat each as a location/time cut (Hall interior, registration,
      outside, market, western wall, evening). The Lyra/Tomas banter is rapid and deadpan;
      let "…I was." land dry. Slow and lower for the two Elias beats — the bird, and the
      compass that points to the mountain. Close quiet and unresolved on "disappointed her
      or brought relief."
    voices:
      Lyra: "seventeen; curious, dry wit"
      Tomas: "fast, deadpan, over-thorough; rare genuine 'I don't know'"
      Elias: "very old; warm, then unguarded grief over the compass"
      Clerk: "kind, routine, ritual cadence"

  - id: chapter-3
    title: "The Festival of Last Things"
    mood: "festive and joyous up top, turning intimate and haunted by the end"
    pace: "lively through the theft/race; slow and grave for the slate ceremony and the ending"
    pause_ms: { scene_break: 1200, line: 350 }
    notes: >
      Widest tonal range in the book so far — six ⸻ sections move from raucous
      (hat theft, the race) to solemn (Seren, the slate ceremony) to tender-and-eerie
      (Mara tying the red thread). Seren speaks quietly but carries; a still, uncanny calm.
      Handle the two supernatural beats with restraint: Elias's bell-fright, and the woman
      in blue behind Mara — no music sting, just a held breath. Land "I am afraid I will
      forget what was mine." bare and quiet. Close hushed on the unseen dancer.
    voices:
      Lyra: "seventeen; curious, dry wit"
      Mara: "warm and teasing, then frightened by her own forgetting"
      Tomas: "deadpan; the slate half he keeps is a crack in the armor"
      Elias: "old; a flash of pale fear at the bell"
      Seren: "quiet, still, uncanny; a traveler who forgot to keep walking"

  - id: chapter-4
    title: "Elias Returns"
    mood: "tender goodbye giving way to real dread; the first undeniable wrongness"
    pace: "slow and aching in the kitchen; brisk on the road; taut and cold at the camp"
    pause_ms: { scene_break: 1400, line: 400 }
    notes: >
      The turn from Act I to Act II. Open intimate — the Mara farewell is the emotional
      anchor; play "…don't decide immediately that it's false" and "I can't remember"
      with quiet fear. Elias's arrival in the square is a public shock — hold the crowd's
      silence. The camp / 43rd-bedroll sequence is the book's first hard supernatural
      event: build methodically, let the counting create dread, and let the overlapping
      argument voices ("The blanket was blue." / "It wasn't blue.") tumble and dissolve.
      End cold on "no one agreed on how many bedrolls there had been."
    voices:
      Lyra: "seventeen; curious, steady, frightened underneath"
      Mara: "tender, guarded, a warning she can't finish"
      Tomas: "deadpan comedy up front, then genuinely rattled by the count"
      Elias: "old; evasive riddles, then trembling, half-hearing someone unseen"
      Seren: "calm; the only one unsurprised by the vanishing bedroll"

  - id: chapter-5
    title: "The House of Memories"
    mood: "grueling and cold on the climb; uncanny in the house; tender-devastating in the dream"
    pace: "labored through the storm/ledge; hushed and strange indoors; dreamlike then breaking in the Mara vision"
    pause_ms: { scene_break: 1500, line: 400 }
    notes: >
      The longest, most pivotal chapter — nine ⸻ sections. The climb should sound
      physically hard (wind tearing words, breath as work); the ledge fall and the
      disembodied "Left hand." are a real jolt. The house is quietly wrong — clean,
      warm, tended by no one. The centerpiece is the **Mara dream**: Lyra inside her
      mother's body, the woman in blue painting the red bird — play it dreamlike and
      aching; young Mara's laugh should land as heartbreak ("Never like this."). Escalate
      the fiftieth-traveler dread to the cold close: "someone had just left."
    voices:
      Lyra: "exhausted, shaken; wonder curdling into fear"
      Tomas: "deadpan, then frightened; the 'May I?' is him softening"
      Elias: "old, unmoored — 'I do not know which of my memories are mine'"
      Seren: "calm, careful, unsurprised; names change things"
      Mara (young): "seventeen, unburdened, a laugh Lyra has never heard"
      woman_in_blue: "warm, sorrowful, certain; speaks in gentle riddles, then afraid"

  - id: chapter-6
    title: "The Climb Begins"
    mood: "punishing ascent building to awe and grief at the Gate"
    pace: "relentless and thinning with altitude; blows open at the Gate reveal, then slow dread on the seventh bell"
    pause_ms: { scene_break: 1500, line: 400 }
    notes: >
      Seven ⸻ sections; the physical climb should sound like it's costing them (breath
      "unfinished", feeling lost in fingers). Two gut-punches: **Tomas dropping the
      notebook** ("Your mother is not in that book!") — let his grief, not the fall, carry
      it; and **the Gate reveal** — awe, then Elias collapsing as he almost remembers Sael.
      The bell count is the payoff of the whole bell motif: ring one through six flat and
      familiar, then let the **seventh** land wrong and cold. End on the missing word —
      Lyra can't remember "home"; the disembodied "Home." should be tender and terrible.
    voices:
      Lyra: "driving herself; then losing a word she cannot get back"
      Tomas: "grief over the notebook = grief over his mother; goes quiet after"
      Elias: "reaching for Sael, breaking, apologizing to someone unseen"
      Seren: "withholding on purpose — 'we are close enough that it already has'"
      woman_in_blue: "a single word at Lyra's ear — 'Home.' — intimate, sorrowful"

  - id: chapter-7
    title: "The Gate"
    mood: "hushed awe and mounting dread; grief; transcendence at the threshold"
    pace: "measured and ceremonial through the crossings; slows and stills for Elias; builds to Lyra's crossing"
    pause_ms: { scene_break: 1600, line: 450 }
    notes: >
      The climax. Six ⸻ sections, each Gate-crossing its own small devastation — Cor
      returning without Anet ("I believe you." / "He did not remember. But he believed.")
      is the gut-punch of the middle; keep it quiet. Tomas's crossing is the one moment of
      grace — let it breathe. Elias's farewell is the emotional peak: play his anger at
      Seren, then his sad joke, then the step through. Seren's "He made the same joke. The
      first time." should chill. Build Lyra's crossing to something ceremonial and
      inevitable; land the final "Welcome home… Amarin." with a held pause before the name,
      then go silent into "Lyra fell forward into another life."
    voices:
      Lyra: "frightened, then certain; each step 'remembered, not learned'"
      Seren: "fear for the first time; reliving an old wound exactly"
      Elias: "anger, then tenderness, then peace as he chooses the empty chair"
      Tomas: "no proof left, only 'I believe you' — trust as the turning point"
      Cor: "a child's joy, then blank politeness — the cruelty of the trade"
      woman_in_blue: "faceless, sorrowful, certain; calls Lyra by another life's name"

  - id: chapter-8
    title: "Amarin"
    mood: "otherworldly, dense, revelatory; grief and cosmic dread braided together"
    pace: "dreamlike and continuous — no scene-break rests; let transitions blur, then surge at Elias's sacrifice and the collapse"
    pause_ms: { line: 450 }
    notes: >
      NOTE: no ⸻ dividers — the chapter flows unbroken through worlds (plain → workshop →
      two chairs → collapse), matching Lyra dissolving into Amarin. Keep it hypnotic; don't
      impose hard breaks. This is the lore core: the anchors, the erasure that "follows
      meaning", the bird as *contradiction*, Amarin as "the one who carries what cannot
      safely belong to anyone." Play Sael faceless and sorrowful. The emotional peak is
      Elias taking the empty chair — his montage of Sael memories should build, then his
      "Do I know you?" must gut. Escalate the filling chairs to horror; land the final line
      cold: the seventh bell now comes "from the empty chair."
    voices:
      Lyra: "two selves at once — Lyra wearing Amarin's scarred hands and borrowed grief"
      Sael: "faceless, exhausted, deliberate; the architect who erased herself"
      Elias (young): "raw, unguarded, wants certainty he can't be trusted with"
      Elias (old): "decades of grief; chooses love over self, then forgets Lyra"
      Mara (young): "the unrestrained laugh again — heartbreak in hindsight"
      Seren: "younger, watchful; later, the one who says 'Run.'"
      Tomas: "the arm through the Gate; the anchor that pulls Lyra back to herself"

  - id: chapter-9
    title: "The Empty Chair"
    mood: "the resolution — grief, temptation, refusal, and communal catharsis; bittersweet, earned"
    pace: "slow and heavy through Seren's confession and the father temptation; warmer and lighter in the chain of small memories; quiet and elegiac at the descent"
    pause_ms: { line: 450 }
    notes: >
      Continuous, no ⸻ dividers (like ch.8). The longest, most complete chapter — the
      thematic payoff. Three movements: (1) **Seren's confession** — his brother "moved,
      not copied"; grave and worn-smooth. (2) **The father** — the Gate's cruelest offer;
      Lyra's "I love you." / "Is that enough?" / "No… but it has to be." is the emotional
      apex; play it devastating. (3) **The chain of small memories** — let it lift into
      warmth and even humor (Seren sharpening his knife when he lies), the book's argument
      made literal: memory lives between people. Close hushed on the thesis — "Memory asks
      what remains. Love decides what you carry." — and the final line as a benediction:
      "She stepped into the storm carrying more people than herself."
    voices:
      Lyra: "grief-stricken but resolute; refuses possession, chooses love"
      Seren: "confession worn smooth by repetition; then wry warmth with Elias"
      Elias: "reaches for the imitation, then lets her go — 'I loved her,' past tense"
      Sael: "the imitation; sorrowful, self-aware; delivers the closing thesis"
      the_father: "warm, perfect, wrong — 'I remember everything' is the tell"
      Tomas: "steady anchor; 'we remember each other… it is what people have always had'"
      Cor / Anet: "belief without memory; the sister beat lands as gentle comedy then tears"

  - id: epilogue
    title: "Another Sky"
    mood: "warm homecoming and quiet grief resolving into hope, then a cold thread of mystery"
    pace: "tender and unhurried through the reunion and the Hall; hushed and dreamlike in the final vision; end on a held, open note"
    pause_ms: { scene_break: 1400, line: 450 }
    notes: >
      Three ⸻ sections plus the dream. Let the Mara reunion land the whole book's ache
      ("Are you all here?" / "Enough of me."). The Hall sequence is the theme made
      civic — Sael's plaque, the empty chair, the bowl of pears, Tomas's new book of
      "things people remember about each other" — play it warm, even funny (pears), but
      earned. Then shift into the closing hook: the dream, the child under another sky, the
      silver line on the bird pointing to an unknown star. The final line is the doorway to
      Novella #2 — deliver it quiet and open, not a sting: "something remembered her name."
    voices:
      Lyra: "home but changed; carrying more than herself now"
      Mara: "joy, then the grief of 'I remember forgetting her'; the ring warmed at the Gate"
      Elias: "gentle, failing, at peace — 'it proves they were here long enough to leave something behind'"
      Seren: "wry, softened; the pears beat"
      Tomas: "hope with humility — 'I found a relationship,' not evidence"
